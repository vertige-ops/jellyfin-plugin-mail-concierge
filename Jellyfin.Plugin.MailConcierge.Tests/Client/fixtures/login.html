<div id="loginPage" data-role="page" class="page libraryPage">
    <form class="manualLoginForm">
        <div class="inputContainer">
            <input is="emby-input" id="txtManualName" type="text" required />
            <label class="inputLabel inputLabelUnfocused" for="txtManualName">User</label>
        </div>
        <div class="inputContainer">
            <input is="emby-input" id="txtManualPassword" type="password" />
            <label class="inputLabel inputLabelUnfocused" for="txtManualPassword">Password</label>
        </div>
        <button type="submit" class="raised button-submit block emby-button"><span>Sign In</span></button>
    </form>
</div>
