<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 376" width="980" height="376" role="img" aria-labelledby="t d">
  <title id="t">Mail Concierge dependencies</title>
  <desc id="d">Three groups. Shipped in the zip: the plugin, which uses MailKit, which uses MimeKit, which uses BouncyCastle. Provided by Jellyfin: the Jellyfin contracts the plugin is built against, plus Microsoft.Extensions, Entity Framework Core, Polly and .NET. Build only, never shipped: code analyzers, test libraries and release tooling.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b2326; }
      .bg { fill: #ffffff; stroke: #c4cdd0; stroke-width: 1; }
      .shipped { fill: #dcefed; stroke: #0b6e69; stroke-width: 1.5; }
      .hostc { fill: #f4f6f6; stroke: #56646a; stroke-width: 1.5; }
      .tools { fill: #ffffff; stroke: #6f7d82; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .box { fill: #ffffff; stroke: #0b6e69; stroke-width: 1; }
      .hbox { fill: #ffffff; stroke: #56646a; stroke-width: 1; }
      .arrow { fill: none; stroke: #1b2326; stroke-width: 1.4; }
      .ttl { font-size: 14px; font-weight: 600; }
      .name { font-size: 12.5px; font-weight: 600; }
      .sub { font-size: 11.5px; fill: #56646a; }
      .grp { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #56646a; }
      .txt { font-size: 12px; }
      .ver { font-size: 11.5px; fill: #56646a; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .lbl { font-size: 11px; fill: #56646a; font-family: ui-monospace, Menlo, Consolas, monospace; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#1b2326"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="979" height="375" rx="4"/>

  <!-- Shipped -->
  <rect class="shipped" x="16" y="16" width="290" height="344" rx="4"/>
  <text class="ttl" x="30" y="40">Shipped in the zip</text>
  <text class="sub" x="30" y="58">what users install</text>
  <rect class="box" x="30" y="72" width="262" height="56" rx="2"/>
  <text class="name" x="42" y="96">Jellyfin.Plugin.MailConcierge</text>
  <text class="sub" x="42" y="114">12.4.0.0 · this plugin</text>
  <line class="arrow" x1="161" y1="128" x2="161" y2="144" marker-end="url(#arr)"/>
  <rect class="box" x="30" y="144" width="262" height="56" rx="2"/>
  <text class="name" x="42" y="168">MailKit</text>
  <text class="sub" x="42" y="186">4.18.2 · SMTP client</text>
  <line class="arrow" x1="161" y1="200" x2="161" y2="216" marker-end="url(#arr)"/>
  <rect class="box" x="30" y="216" width="262" height="56" rx="2"/>
  <text class="name" x="42" y="240">MimeKit</text>
  <text class="sub" x="42" y="258">4.18.2 · builds and encodes messages</text>
  <line class="arrow" x1="161" y1="272" x2="161" y2="288" marker-end="url(#arr)"/>
  <rect class="box" x="30" y="288" width="262" height="56" rx="2"/>
  <text class="name" x="42" y="312">BouncyCastle.Cryptography</text>
  <text class="sub" x="42" y="330">2.7.0 · cryptography used by MimeKit</text>

  <!-- Provided by Jellyfin -->
  <rect class="hostc" x="366" y="16" width="290" height="344" rx="4"/>
  <text class="ttl" x="380" y="40">Provided by Jellyfin</text>
  <text class="sub" x="380" y="58">built against, not shipped</text>
  <rect class="hbox" x="380" y="72" width="262" height="56" rx="2"/>
  <text class="name" x="392" y="96">Jellyfin.Controller, Jellyfin.Model</text>
  <text class="sub" x="392" y="114">12.4.0 · the APIs the plugin calls</text>
  <rect class="hbox" x="380" y="144" width="262" height="56" rx="2"/>
  <text class="name" x="392" y="168">Jellyfin.Data, .Common, .Extensions …</text>
  <text class="sub" x="392" y="186">12.4.0 · pulled in by the two above</text>
  <rect class="hbox" x="380" y="216" width="262" height="56" rx="2"/>
  <text class="name" x="392" y="240">Microsoft.Extensions.*, EF Core</text>
  <text class="sub" x="392" y="258">10.0.14 · injection, logging, database</text>
  <rect class="hbox" x="380" y="288" width="262" height="56" rx="2"/>
  <text class="name" x="392" y="312">Polly · .NET runtime</text>
  <text class="sub" x="392" y="330">8.7.0 · 10 · both come with the server</text>
  <line class="arrow" x1="292" y1="100" x2="380" y2="100" marker-end="url(#arr)"/>
  <text class="lbl" x="298" y="92">built</text>
  <text class="lbl" x="298" y="116">against</text>

  <!-- Build only -->
  <rect class="tools" x="716" y="16" width="248" height="344" rx="4"/>
  <text class="ttl" x="730" y="40">Build only, never shipped</text>
  <text class="sub" x="730" y="58">no effect on users</text>
  <text class="grp" x="730" y="84">CODE ANALYZERS</text>
  <text class="txt" x="730" y="104">StyleCop.Analyzers</text>
  <text class="ver" x="948" y="104" text-anchor="end">1.2.0-beta.556</text>
  <text class="txt" x="730" y="122">SerilogAnalyzer</text>
  <text class="ver" x="948" y="122" text-anchor="end">0.15.0</text>
  <text class="txt" x="730" y="140">SmartAnalyzers.Multithreading…</text>
  <text class="ver" x="948" y="140" text-anchor="end">1.1.31</text>
  <text class="grp" x="730" y="168">TESTS</text>
  <text class="txt" x="730" y="188">xunit.v3</text>
  <text class="ver" x="948" y="188" text-anchor="end">4.0.2</text>
  <text class="txt" x="730" y="206">Moq</text>
  <text class="ver" x="948" y="206" text-anchor="end">4.21.0</text>
  <text class="txt" x="730" y="224">TimeProvider.Testing</text>
  <text class="ver" x="948" y="224" text-anchor="end">9.0.0</text>
  <text class="txt" x="730" y="242">jsdom (npm)</text>
  <text class="ver" x="948" y="242" text-anchor="end">24.1.3</text>
  <text class="grp" x="730" y="270">RELEASE</text>
  <text class="txt" x="730" y="290">jprm</text>
  <text class="ver" x="948" y="290" text-anchor="end">1.1.0</text>
  <text class="txt" x="730" y="308">GitHub Actions</text>
  <text class="ver" x="948" y="308" text-anchor="end">pinned by commit</text>
</svg>
