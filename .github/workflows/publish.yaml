name: '🚀 Publish Plugin'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publication at a time: a run never works from a manifest that another run is about to change.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RestoreLockedMode: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to point at a commit of main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag commit $TAG_SHA is not on main; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Restore NuGet packages from the lock files
        run: dotnet restore --locked-mode

      - name: .NET tests
        run: dotnet test -c Release

      - name: Web client tests
        working-directory: Jellyfin.Plugin.MailConcierge.Tests/Client
        run: |
          node --check ../../Jellyfin.Plugin.MailConcierge/Resources/Client/mailconcierge-client.js
          npm ci && node --test --test-timeout=30000

  build:
    name: Build the plugin
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read   # no write access while third-party code (NuGet, PyPI) runs
    env:
      RestoreLockedMode: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install jprm
        # Exact version and hashes for jprm and every dependency (see jprm-requirements.in).
        run: pip install --require-hashes -r .github/jprm-requirements.txt

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          raw="${TAG#v}"
          # Jellyfin plugin versions have four parts: v12.0.0 and v12.0.0.0 both give 12.0.0.0
          while [ "$(echo "$raw" | tr -cd . | wc -c)" -lt 3 ]; do raw="$raw.0"; done
          echo "version=$raw" >> "$GITHUB_OUTPUT"

      - name: Restore NuGet packages from the lock files
        run: dotnet restore --locked-mode

      - name: Build the plugin zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          jprm plugin build . --output artifacts --version "$VERSION"
          # Name the asset after its targetAbi, as Jellyfin Enhanced does (12.1.0.0 -> _12.1.0.zip)
          abi="$(sed -n 's/^targetAbi: "\(.*\)"/\1/p' build.yaml)"
          mv artifacts/*.zip "artifacts/Jellyfin.Plugin.MailConcierge_${abi%.0}.zip"
          ls -l artifacts

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use only the CHANGELOG.md section matching the tag (12.1.0.0 matches "## 12.1.0" or "## 12.1.0.0").
          short="${VERSION%.0}"
          awk -v v1="$VERSION" -v v2="$short" '
            /^## / { if (found) exit; h=$2; if (h == v1 || h == v2) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Mail Concierge ${VERSION}" > release-notes.md; fi
          cat release-notes.md

      - name: Take manifest.json from main
        run: |
          # The zip was built from the tag; the manifest is the one of main.
          git fetch origin main
          git show origin/main:manifest.json > manifest.json
          # Blob id of the manifest the update starts from; publish refuses to run if main has changed it since.
          git rev-parse origin/main:manifest.json > manifest-base.txt

      - name: Update manifest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip="$(basename "$(ls artifacts/*.zip)")"
          # jprm records the MD5 checksum, the target ABI, the changelog and the timestamp.
          jprm repo add \
            --plugin-url "https://github.com/${REPO}/releases/download/${TAG}/${zip}" \
            ./manifest.json "artifacts/${zip}"

      - name: Gather the files to publish
        run: |
          mkdir release
          cp artifacts/*.zip manifest.json release-notes.md manifest-base.txt release/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and push the manifest commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false   # the token is given to the two steps that need it, never kept in the repository configuration

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release

      - name: Refuse a stale manifest
        run: |
          # manifest-base.txt is only read here: it is never attached to the release nor committed.
          base="$(cat release/manifest-base.txt)"
          current="$(git rev-parse HEAD:manifest.json)"
          if [ "$base" != "$current" ]; then
            echo "::error::manifest.json changed on main since the build; run the workflow again."
            exit 1
          fi

      - name: Refuse a manifest that changes more than this release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The manifest comes from the build job. It must equal the one of main plus exactly one new version entry of this plugin:
          # this release, with the address of its zip asset and the MD5 of the zip downloaded from the build. Nothing is created before this passes.
          if [ "$(ls release/*.zip | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one zip in the build artifact."
            exit 1
          fi
          zip="$(ls release/*.zip)"
          raw="${TAG#v}"
          while [ "$(echo "$raw" | tr -cd . | wc -c)" -lt 3 ]; do raw="$raw.0"; done
          guid="$(sed -n 's/^guid: "\(.*\)"/\1/p' build.yaml)"
          url="https://github.com/${REPO}/releases/download/${TAG}/$(basename "$zip")"
          sum="$(md5sum "$zip" | cut -d' ' -f1)"
          current="$(mktemp)"
          git show HEAD:manifest.json > "$current"
          if ! jq -e --arg guid "$guid" --arg version "$raw" --arg url "$url" --arg sum "$sum" --slurpfile old "$current" '
              def mine: map(select(.guid == $guid));
              def others: map(select(.guid != $guid));
              . as $new
              | $old[0] as $old
              | ($new | type) == "array" and ($old | type) == "array"
                and ($new | others) == ($old | others)
                and ($old | mine | length) == 1 and ($new | mine | length) == 1
                and ($new | mine | .[0] | del(.versions)) == ($old | mine | .[0] | del(.versions))
                and ($new | mine | .[0].versions | map(select(.version != $version))) == ($old | mine | .[0].versions)
                and ($new | mine | .[0].versions | map(select(.version == $version)) | length) == 1
                and ($new | mine | .[0].versions | map(select(.version == $version)) | .[0] | .sourceUrl == $url and .checksum == $sum)
            ' release/manifest.json > /dev/null; then
            echo "::error::manifest.json from the build is not the manifest of main plus one entry for ${raw} (zip address and MD5 checksum as downloaded); refusing to publish."
            exit 1
          fi

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Release $TAG already exists; published versions are never replaced."; exit 1; fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="$(ls release/*.zip)"
          gh release create "$TAG" "$zip" --title "Mail Concierge $TAG" --notes-file release/release-notes.md

      - name: Update manifest.json on main
        run: cp release/manifest.json manifest.json

      - name: Commit manifest.json to main
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
          else
            git commit -m "chore: update manifest for ${TAG}"
            # The token authenticates this one command, through the environment: it is not in a URL, not in a file of the repository and not in the log.
            header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${header}"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$header" git push origin HEAD:main
          fi
