name: '🚀 Publish Plugin'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require the tag to point at a commit of main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag commit $TAG_SHA is not on main; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: .NET tests
        run: dotnet test -c Release

      - name: Web client tests
        working-directory: Jellyfin.Plugin.MailConcierge.Tests/Client
        run: |
          node --check ../../Jellyfin.Plugin.MailConcierge/Resources/Client/mailconcierge-client.js
          npm ci && node --test --test-timeout=30000

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and push the manifest commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install jprm
        # Exact version; no hash pinning (pip --require-hashes would also need the dependencies' hashes).
        run: pip install "jprm==1.1.0"

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          raw="${TAG#v}"
          # Jellyfin plugin versions have four parts: v12.0.0 and v12.0.0.0 both give 12.0.0.0
          while [ "$(echo "$raw" | tr -cd . | wc -c)" -lt 3 ]; do raw="$raw.0"; done
          echo "version=$raw" >> "$GITHUB_OUTPUT"

      - name: Build the plugin zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          jprm plugin build . --output artifacts --version "$VERSION"
          # Name the asset after its targetAbi, as Jellyfin Enhanced does (12.1.0.0 -> _12.1.0.zip)
          abi="$(sed -n 's/^targetAbi: "\(.*\)"/\1/p' build.yaml)"
          mv artifacts/*.zip "artifacts/Jellyfin.Plugin.MailConcierge_${abi%.0}.zip"
          ls -l artifacts

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Use only the CHANGELOG.md section matching the tag (12.1.0.0 matches "## 12.1.0" or "## 12.1.0.0").
          short="${VERSION%.0}"
          awk -v v1="$VERSION" -v v2="$short" '
            /^## / { if (found) exit; h=$2; if (h == v1 || h == v2) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Mail Concierge ${VERSION}" > release-notes.md; fi
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="$(ls artifacts/*.zip)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --title "Mail Concierge $TAG" --notes-file release-notes.md
          fi

      - name: Switch to main for the manifest
        run: |
          # The zip was built from the tag; only the manifest commit goes on main.
          git fetch origin main
          git checkout -B main origin/main

      - name: Update manifest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip="$(basename "$(ls artifacts/*.zip)")"
          # jprm records the MD5 checksum, the target ABI, the changelog and the timestamp.
          jprm repo add \
            --plugin-url "https://github.com/${REPO}/releases/download/${TAG}/${zip}" \
            ./manifest.json "artifacts/${zip}"

      - name: Commit manifest.json to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json unchanged"
          else
            git commit -m "chore: update manifest for ${TAG}"
            git push origin HEAD:main
          fi
