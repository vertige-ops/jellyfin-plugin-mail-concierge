name: '🧪 Test Plugin'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master as of 2026-11-01

  client:
    name: Web client script
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jellyfin.Plugin.MailConcierge.Tests/Client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --check ../../Jellyfin.Plugin.MailConcierge/Resources/Client/mailconcierge-client.js
      - run: npm ci && node --test --test-timeout=30000
