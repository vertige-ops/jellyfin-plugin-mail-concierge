<h1 id="form-title">{{s:page.accept.title}}</h1>
<form id="accept-form" class="form" data-step="form" novalidate>
<p>{{s:page.accept.intro}}</p>
<label for="username">{{s:page.accept.username}}</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{username}}" required>
<p id="username-hint" class="hint" hidden></p>
<label for="email">{{s:page.accept.email}}</label>
<input id="email" name="email" type="email" autocomplete="email" value="{{email}}" required>
<p class="hint">{{s:page.accept.emailHint}}</p>
<label for="password">{{s:page.accept.password}}</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
<p class="hint">{{s:page.reset.hint}}</p>
<label for="confirm">{{s:page.accept.confirm}}</label>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
<label for="avatar">{{s:page.accept.avatar}}</label>
<input id="avatar" name="avatar" type="file" accept="image/png,image/jpeg,image/webp">
<p class="hint">{{s:page.accept.avatarHint}}</p>
<p id="msg" class="error" role="alert" hidden></p>
<button id="submit" type="submit" class="button">{{s:page.accept.submit}}</button>
</form>
<section id="done" class="done" hidden>
<h1>{{s:page.accept.success.title}}</h1>
<p>{{s:page.accept.success}}</p>
<a class="button" href="{{base}}/web/#/login">{{s:page.signin}}</a>
</section>
