<h1 id="form-title">{{s:page.confirm.title}}</h1>
<form id="action-form" class="form" data-step="form">
<p>{{s:page.confirm.intro}}</p>
<p id="msg" class="error" role="alert" hidden></p>
<button id="submit" type="submit" class="button">{{s:page.confirm.submit}}</button>
</form>
<section id="done" class="done" hidden>
<h1>{{s:page.confirm.success.title}}</h1>
<p>{{s:page.confirm.success}}</p>
<a class="button" href="{{base}}/web/#/login">{{s:page.signin}}</a>
</section>
