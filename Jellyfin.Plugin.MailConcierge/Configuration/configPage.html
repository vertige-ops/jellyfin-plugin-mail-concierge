<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mail Concierge</title>
</head>
<body>
    <div id="MailConciergeConfigPage" data-role="page" data-title="Mail Concierge" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <!-- Inside the page element: Jellyfin keeps only this element of a plugin page, so styles in <head> are dropped. -->
        <style>
            /* Severity is carried by a bar or a border and a tinted background; the text keeps the theme colour, so it reads on Jellyfin's light and dark themes. */
            #MailConciergeConfigPage .ucWarn { border-left: 4px solid #f59e0b; padding-left: 0.6em; }
            #MailConciergeConfigPage .ucErr { border-left: 4px solid #e53935; padding-left: 0.6em; }
            #MailConciergeConfigPage .ucBox { padding: 0.8em 1em; margin: 1em 0; border: 1px solid; border-left-width: 4px; color: inherit; }
            #MailConciergeConfigPage .ucBoxErr { border-color: #e53935; background: rgba(229,57,53,0.15); }
            #MailConciergeConfigPage .ucBoxWarn { border-color: #f59e0b; background: rgba(245,158,11,0.18); }
            #MailConciergeConfigPage .ucHelp { display: inline-block; position: relative; margin-left: 0.5em; width: 1.3em; height: 1.3em; line-height: 1.3em; text-align: center; border: 1px solid currentColor; border-radius: 50%; font-size: 0.8em; font-style: normal; font-weight: bold; cursor: help; opacity: 0.8; }
            /* The help icon sits right after the label text; a checkbox label only spans its box and text, so the icon is outside its click area. */
            #MailConciergeConfigPage .ucHelpRow { display: flex; align-items: center; margin-bottom: 0.25em; }
            #MailConciergeConfigPage .ucHelpRow > label { width: auto; margin-bottom: 0; }
            #MailConciergeConfigPage .ucHelpRow > .selectLabel { flex-basis: auto; }
            #MailConciergeConfigPage .ucHelpField { flex: none; z-index: 2; }
            #MailConciergeConfigPage .ucHelp::before { content: "i"; }
            #MailConciergeConfigPage .ucHelp:hover, #MailConciergeConfigPage .ucHelp:focus { opacity: 1; outline: 2px solid #00a4dc; outline-offset: 2px; }
            #MailConciergeConfigPage .ucHelp[hidden] { display: none; }
            /* The help is a real element, not generated text, so that it can hold a link. It opens on hover, on focus, and while the focus is on its link. */
            #MailConciergeConfigPage .ucHelp .ucTip { display: none; position: absolute; z-index: 10; left: 0; top: 100%; padding-top: 0.5em; text-align: left; font-weight: normal; cursor: auto; }
            #MailConciergeConfigPage .ucHelp:hover > .ucTip, #MailConciergeConfigPage .ucHelp:focus > .ucTip, #MailConciergeConfigPage .ucHelp:focus-within > .ucTip { display: block; }
            #MailConciergeConfigPage .ucHelp:focus-within { opacity: 1; }
            #MailConciergeConfigPage .ucTipBox { display: block; box-sizing: border-box; width: 18em; max-width: 70vw; padding: 0.6em 0.8em; background: #202020; color: #fff; border: 1px solid #00a4dc; border-radius: 4px; font-size: 1.15em; line-height: 1.4; white-space: normal; }
            #MailConciergeConfigPage .ucTipPara { display: block; }
            #MailConciergeConfigPage .ucTipPara + .ucTipPara { margin-top: 0.5em; }
            /* Links of this page: the colour of the text, underlined; Jellyfin blue when pointed at or focused. The help bubble is dark in every theme, so its links stay light. */
            #MailConciergeConfigPage a { color: inherit; text-decoration: underline; }
            #MailConciergeConfigPage a:hover, #MailConciergeConfigPage a:focus { color: #00a4dc; }
            #MailConciergeConfigPage .ucTipBox a { color: #fff; }
            #MailConciergeConfigPage .ucTipBox a:hover, #MailConciergeConfigPage .ucTipBox a:focus { color: #00a4dc; }
            /* An emby-button has its own display rule, which would otherwise win over the hidden attribute. */
            #ucClearSmtpPassword[hidden] { display: none; }
            /* Invitation history: a table above 720 px, one card per invitation below. The text keeps the theme colour. */
            #MailConciergeConfigPage .ucInvTools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em 1em; margin: 0.8em 0; }
            #MailConciergeConfigPage #ucInvFilters { display: flex; flex-wrap: wrap; gap: 0.4em; }
            #MailConciergeConfigPage .ucInvFilter { padding: 0.3em 0.9em; border: 1px solid rgba(128,128,128,0.4); border-radius: 999px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
            #MailConciergeConfigPage .ucInvFilter[aria-pressed="true"] { border-color: #00a4dc; background: rgba(0,164,220,0.2); }
            #MailConciergeConfigPage #ucInvSearch { box-sizing: border-box; flex: 1 1 14em; max-width: 24em; padding: 0.4em 0.7em; border: 1px solid rgba(128,128,128,0.4); border-radius: 4px; background: transparent; color: inherit; font: inherit; }
            #MailConciergeConfigPage .ucInvWide { display: block; overflow-x: auto; }
            #MailConciergeConfigPage .ucInvNarrow { display: none; }
            #MailConciergeConfigPage #ucInvTable { width: 100%; border-collapse: collapse; }
            #MailConciergeConfigPage #ucInvTable th, #MailConciergeConfigPage #ucInvTable td { padding: 0.6em 0.8em; text-align: left; vertical-align: top; border-bottom: 1px solid rgba(128,128,128,0.4); }
            #MailConciergeConfigPage #ucInvTable th { font-weight: normal; opacity: 0.7; }
            #MailConciergeConfigPage .ucInvCard { margin: 0.6em 0; padding: 0.8em 1em; border: 1px solid rgba(128,128,128,0.4); border-radius: 8px; }
            #MailConciergeConfigPage .ucInvCard > * + * { margin-top: 0.5em; }
            #MailConciergeConfigPage .ucInvName { font-weight: bold; overflow-wrap: anywhere; }
            #MailConciergeConfigPage .ucInvSub { opacity: 0.7; font-size: 0.9em; overflow-wrap: anywhere; }
            #MailConciergeConfigPage .ucInvStatus { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.15em 0.7em 0.15em 0.5em; border: 1px solid currentColor; border-radius: 999px; font-size: 0.9em; white-space: nowrap; }
            #MailConciergeConfigPage .ucInvStatus svg { width: 1.1em; height: 1.1em; flex: none; }
            #MailConciergeConfigPage .ucInvAccess { display: flex; flex-wrap: wrap; gap: 0.3em; }
            #MailConciergeConfigPage .ucInvPill { padding: 0.1em 0.6em; border: 1px solid rgba(128,128,128,0.4); border-radius: 999px; font-size: 0.9em; overflow-wrap: anywhere; max-width: 100%; }
            #MailConciergeConfigPage .ucInvPillTv { border-color: currentColor; }
            #MailConciergeConfigPage .ucInvNone { opacity: 0.7; }
            /* E-mails of each account (Accounts tab): one line per item, wrapping on a phone. */
            #MailConciergeConfigPage .ucStatList { list-style: none; margin: 0.4em 0; padding: 0; }
            #MailConciergeConfigPage .ucStatList li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2em 1em; padding: 0.5em 0; border-bottom: 1px solid rgba(128,128,128,0.4); }
            #MailConciergeConfigPage .ucStatName { font-weight: bold; overflow-wrap: anywhere; }
            #MailConciergeConfigPage .ucStatFailed { font-weight: bold; }
            #MailConciergeConfigPage .ucInvActions { display: flex; flex-wrap: wrap; align-items: center; }
            @media (max-width: 720px) {
                #MailConciergeConfigPage .ucInvWide { display: none; }
                #MailConciergeConfigPage .ucInvNarrow { display: block; }
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2 data-t="title"></h2>

                <div id="ucBanner" class="ucBox ucBoxErr" role="alert" hidden></div>
                <div id="ucDisabledBanner" class="ucBox ucBoxWarn" role="status" hidden></div>
                <div id="ucMailBanner" class="ucBox ucBoxWarn" role="status" hidden></div>

                <div class="ucTabBar" role="tablist" style="display:flex;flex-wrap:wrap;gap:0.4em;margin:1em 0">
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-general" data-tab="general" aria-controls="ucTab-general"><span data-t="tabGeneral"></span></button>
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-smtp" data-tab="smtp" aria-controls="ucTab-smtp"><span data-t="tabSmtp"></span></button>
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-templates" data-tab="templates" aria-controls="ucTab-templates"><span data-t="tabTemplates"></span></button>
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-seerr" data-tab="seerr" aria-controls="ucTab-seerr"><span data-t="tabSeerr"></span></button>
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-accounts" data-tab="accounts" aria-controls="ucTab-accounts"><span data-t="tabAccounts"></span></button>
                    <button is="emby-button" type="button" class="raised emby-button ucTabBtn" role="tab" id="ucTabBtn-invitations" data-tab="invitations" aria-controls="ucTab-invitations"><span data-t="tabInvitations"></span></button>
                </div>

                <div class="ucTab" id="ucTab-general" role="tabpanel" aria-labelledby="ucTabBtn-general" hidden>
                    <form data-tab-form="general">
                    <div id="ucQuotaBanner" class="ucBox ucBoxWarn" role="status" hidden></div>
                    <h3 data-t="secGeneral"></h3>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <div class="ucHelpRow"><label class="emby-checkbox-label"><input data-f="enabled" type="checkbox" is="emby-checkbox" /><span data-t="enabled"></span></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="enabledHint"></span></div>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="publicUrl"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.publicUrl publicUrlHint"></span></div>
                        <input data-f="publicUrl" type="url" is="emby-input" autocomplete="off" />
                        <div id="ucPublicUrlSuggested" class="fieldDescription" role="status" data-t="publicUrlSuggested" hidden></div>
                        <div id="ucWarnPublicUrl" class="fieldDescription ucWarn" role="status" data-t="warnHttpPublicUrl" hidden>This URL starts with http://: the links in e-mails will travel unencrypted.</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <div class="ucHelpRow"><label class="emby-checkbox-label"><input data-f="emailLogin" type="checkbox" is="emby-checkbox" /><span data-t="emailLogin"></span></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.emailLogin"></span></div>
                        <div id="ucEmailLoginUnavailable" class="fieldDescription checkboxFieldDescription ucWarn" role="status" hidden></div>
                        <div id="ucEmailLoginShared" class="fieldDescription checkboxFieldDescription" role="status" hidden></div>
                        <div id="ucEmailLoginSharedAccounts" class="fieldDescription checkboxFieldDescription" role="status" hidden></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <div class="ucHelpRow"><label class="emby-checkbox-label"><input data-f="allowAdministrators" type="checkbox" is="emby-checkbox" /><span data-t="allowAdmins"></span></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.allowAdministrators allowAdminsHint"></span></div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <div class="ucHelpRow"><label class="emby-checkbox-label"><input data-f="nativeForgotPassword" type="checkbox" is="emby-checkbox" /><span data-t="native"></span></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="nativeHint"></span></div>
                    </div>
                    <div class="selectContainer">
                        <div class="ucHelpRow"><label class="selectLabel" data-t="sessions"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.sessionsOnReset"></span></div>
                        <select is="emby-select" data-f="sessionsOnReset" class="emby-select-withcolor emby-select">
                            <option value="All" data-t="sessAll"></option>
                            <option value="InactiveSinceDays" data-t="sessInactive"></option>
                            <option value="None" data-t="sessNone"></option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="sessionDays"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.sessionDays"></span></div>
                        <input data-f="sessionInactiveDays" type="number" is="emby-input" min="1" />
                    </div>

                    <h3 data-t="secDurations" style="margin-top:2em"></h3>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="invitationDays"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.invitationDays"></span></div>
                        <input data-f="invitationDays" type="number" is="emby-input" min="1" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="pinMinutes"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.pinMinutes"></span></div>
                        <input data-f="pinMinutes" type="number" is="emby-input" min="1" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="confirmationHours"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.confirmationHours"></span></div>
                        <input data-f="confirmationHours" type="number" is="emby-input" min="1" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="cancelHours"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.cancelHours"></span></div>
                        <input data-f="cancelEmailChangeHours" type="number" is="emby-input" min="1" />
                    </div>

                    <h3 data-t="secLimits" style="margin-top:2em"></h3>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="maxEmailsPerRecipient"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.maxEmailsPerRecipient"></span></div>
                        <input data-f="maxEmailsPerRecipientPerDay" type="number" is="emby-input" min="1" max="1000" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="maxEmailsPerDay"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.maxEmailsPerDay"></span></div>
                        <input data-f="maxEmailsPerDay" type="number" is="emby-input" min="1" max="10000" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="adminNotificationAddress"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.adminNotificationAddress"></span></div>
                        <input data-f="adminNotificationAddress" type="email" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="maxIp"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.maxIp"></span></div>
                        <input data-f="maxForgotRequestsPerIpPer15Min" type="number" is="emby-input" min="1" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="maxPin"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.maxPin"></span></div>
                        <input data-f="maxPinFailures" type="number" is="emby-input" min="1" />
                    </div>

                    <div id="ucQuota" hidden>
                        <h3 data-t="quotaTitle" style="margin-top:2em"></h3>
                        <p id="ucQuotaLine" class="fieldDescription"></p>
                        <p id="ucQuotaBlocked" class="fieldDescription" hidden></p>
                    </div>

                    <p id="ucError-general" class="ucErr" role="alert" hidden></p>
                    <p id="ucSaved-general" role="status" hidden></p>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-t="save"></span></button>
                    </div>
                    </form>
                </div>

                <div class="ucTab" id="ucTab-smtp" role="tabpanel" aria-labelledby="ucTabBtn-smtp" hidden>
                    <form data-tab-form="smtp">
                    <h3 data-t="secSmtp"></h3>
                    <div class="selectContainer">
                        <div class="ucHelpRow"><label class="selectLabel" for="ucSmtpProvider" data-t="smtpProvider"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.smtpProvider" data-help-dyn="provider"></span></div>
                        <select is="emby-select" id="ucSmtpProvider" class="emby-select-withcolor emby-select">
                            <option value="" data-t="smtpProviderCustom">Custom</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" data-t="smtpHost"></label>
                        <input data-f="smtpHost" type="text" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" data-t="smtpPort"></label>
                        <input data-f="smtpPort" type="number" is="emby-input" min="1" max="65535" />
                    </div>
                    <div class="selectContainer">
                        <div class="ucHelpRow"><label class="selectLabel" data-t="smtpSecurity"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.smtpSecurity"></span></div>
                        <select is="emby-select" data-f="smtpSecurity" class="emby-select-withcolor emby-select">
                            <option value="StartTls">STARTTLS</option>
                            <option value="SslOnConnect">SSL/TLS</option>
                            <option value="None" data-t="secNone"></option>
                        </select>
                        <div id="ucWarnSmtp" class="fieldDescription ucWarn" role="status" data-t="warnSmtpNone" hidden>Security “None”: e-mails and the SMTP password travel unencrypted.</div>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="smtpUser"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help-dyn="user" hidden></span></div>
                        <input data-f="smtpUsername" type="text" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="smtpPassword"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="secretHint" data-help-dyn="password"></span></div>
                        <input data-f="smtpPassword" data-secret="smtpPasswordSet" type="password" is="emby-input" autocomplete="new-password" />
                        <button is="emby-button" type="button" class="raised emby-button" id="ucClearSmtpPassword" hidden><span data-t="smtpPasswordClear"></span></button>
                        <div id="ucSmtpRetypePassword" class="fieldDescription ucWarn" role="status" hidden></div>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="fromAddress"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.fromAddress"></span></div>
                        <input data-f="fromAddress" type="email" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" data-t="fromName"></label>
                        <input data-f="fromName" type="text" is="emby-input" autocomplete="off" />
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="testTo"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="testHint"></span></div>
                        <input id="ucTestTo" type="email" is="emby-input" autocomplete="off" />
                    </div>
                    <button is="emby-button" type="button" class="raised emby-button" id="ucTest"><span data-t="testSend"></span></button>
                    <p id="ucTestResult" hidden></p>

                    <p id="ucError-smtp" class="ucErr" role="alert" hidden></p>
                    <p id="ucSaved-smtp" role="status" hidden></p>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-t="save"></span></button>
                    </div>
                    </form>
                </div>

                <div class="ucTab" id="ucTab-templates" role="tabpanel" aria-labelledby="ucTabBtn-templates" hidden>
                    <form data-tab-form="templates">
                    <h3><span data-t="secTemplates"></span><span class="ucHelp" tabindex="0" role="img" aria-label="" data-help="help.templates templatesHint"></span></h3>
                    <div class="selectContainer">
                        <div class="ucHelpRow"><label class="selectLabel" data-t="defaultLanguage"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.defaultLanguage defaultLanguageHint"></span></div>
                        <select is="emby-select" data-f="defaultLanguage" class="emby-select-withcolor emby-select">
                        </select>
                    </div>
                    <div class="selectContainer">
                        <div class="ucHelpRow"><label class="selectLabel" data-t="emailLogo"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.emailLogo" data-help-dyn="logo"></span></div>
                        <select is="emby-select" data-f="emailLogo" class="emby-select-withcolor emby-select">
                            <option value="Embedded" data-t="logoEmbedded"></option>
                            <option value="Hosted" data-t="logoHosted"></option>
                            <option value="None" data-t="logoNone"></option>
                        </select>
                    </div>
                    <p class="fieldDescription" id="ucTemplatesLang"></p>
                    <div id="ucTemplates"></div>

                    <p id="ucError-templates" class="ucErr" role="alert" hidden></p>
                    <p id="ucSaved-templates" role="status" hidden></p>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-t="save"></span></button>
                    </div>
                    </form>
                </div>

                <div class="ucTab" id="ucTab-seerr" role="tabpanel" aria-labelledby="ucTabBtn-seerr" hidden>
                    <form data-tab-form="seerr">
                    <h3 data-t="secSeerr"></h3>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label"><input data-f="seerrEnabled" type="checkbox" is="emby-checkbox" /><span data-t="seerrEnabled"></span></label>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="seerrUrl"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.seerrUrl"></span></div>
                        <input data-f="seerrUrl" type="url" is="emby-input" autocomplete="off" />
                        <div id="ucWarnSeerr" class="fieldDescription ucWarn" role="status" data-t="warnHttpSeerr" hidden>This URL starts with http://: the Seerr API key will travel unencrypted.</div>
                    </div>
                    <div class="inputContainer">
                        <div class="ucHelpRow"><label class="inputLabel inputLabelUnfocused" data-t="seerrKey"></label><span class="ucHelp ucHelpField" tabindex="0" role="img" aria-label="" data-help="help.seerrApiKey secretHint"></span></div>
                        <input data-f="seerrApiKey" data-secret="seerrApiKeySet" type="password" is="emby-input" autocomplete="new-password" />
                    </div>

                    <p id="ucError-seerr" class="ucErr" role="alert" hidden></p>
                    <p id="ucSaved-seerr" role="status" hidden></p>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span data-t="save"></span></button>
                    </div>
                    </form>
                <h3><span data-t="secSeerrTools"></span><span class="ucHelp" tabindex="0" role="img" aria-label="" data-help="seerrToolsHint"></span></h3>
                <button is="emby-button" type="button" class="raised emby-button" id="ucSync"><span data-t="syncNow"></span></button>
                <button is="emby-button" type="button" class="raised emby-button" id="ucPreview"><span data-t="preview"></span></button>
                <p id="ucSeerrResult" hidden></p>
                <div id="ucImportBox" hidden>

        <script type="text/javascript">
            (function () {
                'use strict';

                var PLUGIN_ID = '4643600e-9108-4342-8cdd-1ebb049bc033';
                var TEMPLATE_NAMES = ['invitation', 'recovery', 'confirm-email', 'email-changed', 'password-changed'];
                var EXTENSIONS = ['html', 'txt'];
                var TABS = ['general', 'smtp', 'templates', 'seerr'];
                var languages = [];

                // Minimal English fallback; the full texts come from the server (MailConcierge/Admin/Strings), in the language of the user.
                var FALLBACK = {
                    title: 'Mail Concierge',
                    save: 'Save',
                    smtpProvider: 'Provider',
                    smtpProviderCustom: 'Custom',
                    smtpPresetDoc: 'Official instructions',
                    smtpDomainNote: 'Check the sender\'s domain with this provider (SPF, DKIM), otherwise messages may end up in spam.',
                    smtpRetypePassword: 'Type the password again for this provider.',
                    publicUrlSuggested: 'Taken from the address published in Jellyfin: check it, then save.',
                    saved: 'Settings saved.',
                    quotaTitle: 'E-mails of the last 24 hours',
                    quotaLine: '{0} of {1} e-mails counted. One recipient can receive up to {2}.',
                    quotaBlocked: '{0} recipient(s) reached their limit.',
                    quotaReached: 'A daily e-mail limit was reached on {0}: some e-mails were not sent.',
                    statsTitle: 'E-mails sent per account',
                    statsSince: 'Counted since Jellyfin started on {0}',
                    statsInvitations: 'Invitations: {0} sent, {1} failed',
                    statsReceived: '{0} e-mail(s) sent, the last on {1}',
                    statsFailed: '{0} failed',
                    statsNone: 'No e-mail sent since the start',
                    statsUnavailable: 'The e-mail counters are unavailable.',
                    errGeneric: 'Something went wrong.',
                    'inv.title': 'Invitations',
                    'inv.send': 'Send',
                    'inv.copyLink': 'Copy link',
                    'inv.errGeneric': 'Something went wrong.',
                    'inv.selectAll': 'Select all',
                    'inv.liveTv': 'Live TV',
                    'inv.confirmErase': 'Erase this line of the history? This cannot be undone.',
                    disabledBanner: 'Mail Concierge is turned off: tick "Enable Mail Concierge" on the General tab, then save. Until then invitations and e-mail recovery do not work.',
                    'inv.col.user': 'User',
                    'inv.col.status': 'Status',
                    'inv.col.access': 'Access',
                    'inv.col.date': 'Date',
                    'inv.col.actions': 'Actions',
                    'inv.filter.all': 'All',
                    'inv.search': 'Search a name or address',
                    'inv.noAccess': 'None',
                    'inv.noEmail': 'Link to copy, no address',
                    'inv.date.accepted': 'Accepted on {0}',
                    'inv.date.pending': 'Expires on {0}',
                    'inv.date.expired': 'Expired on {0}',
                    'inv.date.revoked': 'Revoked',
                    'inv.openProfile': 'Open the profile of {0}',
                    'inv.noMatch': 'No invitation matches.'
                };

                // Reason codes of the proxy guard, resolved here so the banner is localized.
                var REASONS = { unknown_proxy: 'proxyUnknown' };

                var page = document.querySelector('#MailConciergeConfigPage');
                var s = FALLBACK;
                var defaults = {};
                var loadedOverrides = {};
                // SMTP presets served by the server (empty when they could not be loaded: the list then offers "Custom" only).
                var presets = [];
                // The saved SMTP host and whether a password is stored (what the server compares a change against).
                var storedSmtp = { host: '', passwordSet: false };
                var suggestedUrl = '';
                // Providers that are a mailbox, not a sending domain: no SPF/DKIM reminder.
                var NO_DOMAIN_NOTE = { gmail: true };
                // Preset security (starttls, ssl) to the value of the saved settings.
                var PRESET_SECURITY = { starttls: 'StartTls', ssl: 'SslOnConnect' };
                // Language of the page (and default language of an invitation).
                var invLang = 'en';

                function $(id) { return page.querySelector('#' + id); }

                // The display language as is (else the browser one): the server picks the closest supported language.
                function pickLanguage() {
                    var candidates = [];
                    try {
                        // jellyfin-web keeps the display language in localStorage ("<userId>-language", or "language").
                        var userId = window.ApiClient && window.ApiClient.getCurrentUserId ? window.ApiClient.getCurrentUserId() : null;
                        if (userId) {
                            candidates.push(window.localStorage.getItem(userId + '-language'));
                        }
                        candidates.push(window.localStorage.getItem('language'));
                    } catch (e) { /* not available */ }
                    candidates.push(document.documentElement.getAttribute('lang'));
                    try {
                        if (window.Globalize && typeof window.Globalize.locale === 'function') {
                            var locale = window.Globalize.locale();
                            candidates.push(typeof locale === 'string' ? locale : (locale && locale.locale));
                        }
                    } catch (e) { /* not available */ }
                    candidates.push(navigator.language);
                    for (var i = 0; i < candidates.length; i++) {
                        if (candidates[i]) {
                            return String(candidates[i]);
                        }
                    }
                    return '';
                }

                // The texts of the settings and the ones of the Invitations tab (keys prefixed "inv.").
                function loadStrings() {
                    var wanted = encodeURIComponent(pickLanguage());
                    return Promise.all([
                        api('GET', 'MailConcierge/Admin/Strings?page=config&lang=' + wanted),
                        api('GET', 'MailConcierge/Admin/Strings?page=invitations&lang=' + wanted)
                    ]).then(function (r) {
                        var merged = Object.assign({}, FALLBACK, r[0] && r[0].strings);
                        var invStrings = (r[1] && r[1].strings) || {};
                        Object.keys(invStrings).forEach(function (key) { merged['inv.' + key] = invStrings[key]; });
                        s = merged;
                        invLang = (r[0] && r[0].language) || 'en';
                    }, function () { s = FALLBACK; });
                }

                // Textareas hold LF line endings whatever the source had: compare with LF on both sides.
                function lf(text) { return String(text === null || text === undefined ? '' : text).replace(/\r\n?/g, '\n'); }

                function applyStrings() {
                    Array.prototype.forEach.call(page.querySelectorAll('[data-t]'), function (el) {
                        var text = s[el.getAttribute('data-t')];
                        if (typeof text === 'string') {
                            el.textContent = text;
                        }
                    });
                    applyHelp();
                }

                // The (i) icons. Their content is a list of paragraphs, from the string keys of data-help (separated by spaces) and, for the
                // few that depend on the page (provider, user name, password, logo), from helpDynamic(). A paragraph is text, or text with a link.
                // The bubble is built with createElement/textContent only. The text is also the accessible name of the icon; an icon with nothing to say is hidden.
                function helpParts(el) {
                    var parts = [];
                    (el.getAttribute('data-help') || '').split(/\s+/).forEach(function (key) {
                        if (key && typeof s[key] === 'string' && s[key]) { parts.push({ text: s[key] }); }
                    });
                    var dynamic = el.getAttribute('data-help-dyn');
                    return dynamic ? parts.concat(helpDynamic(dynamic)) : parts;
                }

                // The provider's hints, for the SMTP fields; the logo hint of the chosen mode.
                function helpDynamic(kind) {
                    var preset = presetById($('ucSmtpProvider').value);
                    var text = function (key) { return typeof s[key] === 'string' && s[key] ? { text: s[key] } : null; };
                    var parts = [];
                    if (kind === 'provider' && preset) {
                        parts.push(text('smtpPreset.' + preset.id + '.note'));
                        parts.push(NO_DOMAIN_NOTE[preset.id] ? null : text('smtpDomainNote'));
                        if (/^https:\/\/[^\s]/i.test(preset.docUrl)) { parts.push({ text: s.smtpPresetDoc || preset.name, href: preset.docUrl }); }
                    } else if (kind === 'user' && preset) {
                        parts.push(text('smtpPreset.' + preset.id + '.user'));
                    } else if (kind === 'password' && preset) {
                        parts.push(text('smtpPreset.' + preset.id + '.password'));
                    } else if (kind === 'logo') {
                        parts.push(text('logo' + fieldOf('emailLogo').value + 'Hint'));
                    }
                    return parts.filter(Boolean);
                }

                function applyHelp() {
                    Array.prototype.forEach.call(page.querySelectorAll('[data-help], [data-help-dyn]'), function (el) {
                        var parts = helpParts(el);
                        var signature = JSON.stringify(parts);
                        if (el.getAttribute('data-sig') === signature) { return; }
                        el.setAttribute('data-sig', signature);
                        var old = el.querySelector('.ucTip');
                        if (old) { el.removeChild(old); }
                        el.hidden = !parts.length;
                        if (!parts.length) { el.removeAttribute('aria-label'); return; }
                        var tip = document.createElement('span');
                        tip.className = 'ucTip';
                        var box = document.createElement('span');
                        box.className = 'ucTipBox';
                        parts.forEach(function (part) {
                            var para = document.createElement('span');
                            para.className = 'ucTipPara';
                            if (part.href) {
                                var link = document.createElement('a');
                                link.href = part.href;
                                link.target = '_blank';
                                link.rel = 'noopener noreferrer';
                                link.textContent = part.text;
                                para.appendChild(link);
                            } else {
                                para.textContent = part.text;
                            }
                            box.appendChild(para);
                        });
                        tip.appendChild(box);
                        el.appendChild(tip);
                        el.setAttribute('aria-label', parts.map(function (part) { return part.text; }).join(' '));
                        // The children of an image are hidden from screen readers: an icon that holds a link is a group, so the link can be reached.
                        el.setAttribute('role', parts.some(function (part) { return !!part.href; }) ? 'group' : 'img');
                    });
                }

                function show(id, text, isError) {
                    var el = $(id);
                    el.textContent = text || '';
                    el.hidden = !text;
                    if (isError !== undefined) {
                        el.classList.toggle('ucErr', !!isError);
                        // An error far from the button (the end of a long tab) is brought into view.
                        if (isError && text && typeof el.scrollIntoView === 'function') { el.scrollIntoView({ block: 'nearest' }); }
                    }
                }

                function api(method, path, body) {
                    var options = { type: method, url: ApiClient.getUrl(path), dataType: 'json' };
                    if (body !== undefined) {
                        options.data = JSON.stringify(body);
                        options.contentType = 'application/json';
                    }
                    return ApiClient.ajax(options);
                }

                function errorOf(response) {
                    if (!response || typeof response.json !== 'function') {
                        return Promise.resolve(s.errGeneric);
                    }
                    return response.json().then(function (json) {
                        return (json && s['err.' + json.code]) || s.errGeneric;
                    }, function () { return s.errGeneric; });
                }

                function fields(tab) { return page.querySelectorAll(tab ? '#ucTab-' + tab + ' [data-f]' : '[data-f]'); }

                function currentLanguage() {
                    var select = page.querySelector('select[data-f="defaultLanguage"]');
                    return (select && select.value) || '';
                }

                // Keeps the edits of the displayed templates in loadedOverrides (the working copy of all overrides).
                function syncTemplates() {
                    Array.prototype.forEach.call($('ucTemplates').querySelectorAll('textarea'), function (area) {
                        var key = area.getAttribute('data-key');
                        // Equal to the shipped template (or empty) = no override.
                        if (area.value.trim() && lf(area.value) !== lf(defaults[key])) {
                            loadedOverrides[key] = area.value;
                        } else {
                            delete loadedOverrides[key];
                        }
                    });
                }

                // only: the id of a tab to refill (the others keep their unsaved edits).
                // Non-blocking warnings under the fields whose current value sends secrets or links in clear text.
                function updateWarnings() {
                    function isHttp(name) { return /^\s*http:\/\//i.test(page.querySelector('[data-f="' + name + '"]').value); }
                    $('ucWarnPublicUrl').hidden = !isHttp('publicUrl');
                    $('ucWarnSeerr').hidden = !isHttp('seerrUrl');
                    $('ucWarnSmtp').hidden = page.querySelector('[data-f="smtpSecurity"]').value !== 'None';
                    // The hint of the chosen logo mode is in the (i) of the field.
                    applyHelp();
                }

                // Only well-formed presets with an https documentation link are kept (anything else is ignored, never shown).
                function usablePresets(list) {
                    if (!Array.isArray(list)) { return []; }
                    return list.filter(function (p) {
                        return p && typeof p.id === 'string' && p.id && typeof p.name === 'string' && p.name && typeof p.host === 'string' && p.host
                            && typeof p.port === 'number' && p.port > 0 && PRESET_SECURITY.hasOwnProperty(p.security)
                            && typeof p.docUrl === 'string' && /^https:\/\/[^\s]/i.test(p.docUrl);
                    });
                }

                function presetById(id) {
                    for (var i = 0; i < presets.length; i++) { if (presets[i].id === id) { return presets[i]; } }
                    return null;
                }

                function fieldOf(name) { return page.querySelector('[data-f="' + name + '"]'); }

                // The first preset whose host (any case), port and security are exactly these ones, or null (Custom).
                function matchPreset(host, port, security) {
                    for (var i = 0; i < presets.length; i++) {
                        var preset = presets[i];
                        if (String(host || '').toLowerCase() === preset.host.toLowerCase() && Number(port) === preset.port && security === PRESET_SECURITY[preset.security]) {
                            return preset;
                        }
                    }
                    return null;
                }

                // The list: "Custom" (static option) then one option per preset, the one matching the saved settings selected.
                function buildProviders(config) {
                    var select = $('ucSmtpProvider');
                    while (select.options.length > 1) { select.remove(1); }
                    presets.forEach(function (preset) {
                        var option = document.createElement('option');
                        option.value = preset.id;
                        option.textContent = preset.name;
                        select.appendChild(option);
                    });
                    var selected = matchPreset(config.smtpHost, config.smtpPort, config.smtpSecurity);
                    select.value = selected ? selected.id : '';
                    show('ucSmtpRetypePassword', '');
                    applyHelp();
                }

                // After a hand edit of the host, the port or the security: the list and the help follow the fields (nothing else changes).
                function syncProvider() {
                    var selected = matchPreset(fieldOf('smtpHost').value, fieldOf('smtpPort').value, fieldOf('smtpSecurity').value);
                    $('ucSmtpProvider').value = selected ? selected.id : '';
                    applyHelp();
                }

                // Fills host, port and security only: nothing is saved, the user name and the password are left alone.
                function applyPreset(id) {
                    var preset = presetById(id);
                    show('ucSmtpRetypePassword', '');
                    applyHelp();
                    if (!preset) { return; }
                    fieldOf('smtpHost').value = preset.host;
                    fieldOf('smtpPort').value = preset.port;
                    fieldOf('smtpSecurity').value = PRESET_SECURITY[preset.security];
                    updateWarnings();
                    // A stored password does not follow a change of server (the server refuses it): ask for it again.
                    var password = fieldOf('smtpPassword');
                    if (storedSmtp.passwordSet && !password.value && preset.host.toLowerCase() !== storedSmtp.host.toLowerCase()) {
                        show('ucSmtpRetypePassword', s.smtpRetypePassword);
                        password.focus();
                    }
                }

                function fill(config, only) {
                    if (!only) {
                        languages = config.languages || [];
                        var select = page.querySelector('select[data-f="defaultLanguage"]');
                        select.textContent = '';
                        var invSelect = $('ucInvLanguage');
                        invSelect.textContent = '';
                        languages.forEach(function (language) {
                            [select, invSelect].forEach(function (target) {
                                var option = document.createElement('option');
                                option.value = language.code;
                                option.textContent = language.name;
                                target.appendChild(option);
                            });
                        });
                        invSelect.value = invLang;
                    }
                    // The validity of an invitation starts at the configured default.
                    if ((!only || only === 'general') && config.invitationDays > 0) {
                        $('ucInvDays').value = config.invitationDays;
                    }
                    Array.prototype.forEach.call(fields(only), function (el) {
                        var key = el.getAttribute('data-f');
                        if (el.type === 'checkbox') {
                            el.checked = !!config[key];
                        } else if (el.getAttribute('data-secret')) {
                            el.value = '';
                            el.placeholder = config[el.getAttribute('data-secret')] ? s.secretSet : '';
                        } else {
                            el.value = config[key] === null || config[key] === undefined ? '' : config[key];
                        }
                    });
                    if (!only || only === 'smtp') {
                        $('ucClearSmtpPassword').hidden = !config.smtpPasswordSet;
                        storedSmtp = { host: String(config.smtpHost || ''), passwordSet: !!config.smtpPasswordSet };
                        buildProviders(config);
                    }
                    // An empty public URL is prefilled with the address published in Jellyfin; nothing is saved until the administrator saves.
                    if (!only || only === 'general') {
                        var urlField = fieldOf('publicUrl');
                        suggestedUrl = '';
                        if (!String(config.publicUrl || '').trim() && typeof config.suggestedPublicUrl === 'string' && config.suggestedPublicUrl.trim()) {
                            suggestedUrl = config.suggestedPublicUrl;
                            urlField.value = suggestedUrl;
                        }
                        $('ucPublicUrlSuggested').hidden = !suggestedUrl;
                    }
                    updateWarnings();
                    if (!only || only === 'templates') {
                        loadedOverrides = Object.assign({}, config.templateOverrides || {});
                        buildTemplates();
                    }
                }

                // Only the keys of the tab: the server leaves absent keys unchanged. Secrets only when typed.
                function collect(tab) {
                    var body = {};
                    Array.prototype.forEach.call(fields(tab), function (el) {
                        var key = el.getAttribute('data-f');
                        // A disabled control (the e-mail sign-in box when the server does not offer it) is not sent, so its stored value is kept.
                        if (el.disabled) {
                            return;
                        }
                        if (el.type === 'checkbox') {
                            body[key] = el.checked;
                        } else if (el.getAttribute('data-secret')) {
                            if (el.value) { body[key] = el.value; }
                        } else if (el.type === 'number') {
                            var n = parseInt(el.value, 10);
                            body[key] = isNaN(n) ? 0 : n;
                        } else {
                            body[key] = el.value;
                        }
                    });
                    if (tab === 'templates') {
                        // The server replaces the whole set when it is present: send every language (the other ones as loaded).
                        syncTemplates();
                        body.templateOverrides = Object.assign({}, loadedOverrides);
                    }
                    return body;
                }

                // Textareas for the e-mail language chosen at the top of this tab (its current value, saved or not).
                function buildTemplates() {
                    var box = $('ucTemplates');
                    box.textContent = '';
                    var lang = currentLanguage();
                    var name = '';
                    languages.forEach(function (language) { if (language.code === lang) { name = language.name; } });
                    show('ucTemplatesLang', name ? fmt(s.templatesLang || '{0}', name) : '');
                    if (!name) { return; }
                    TEMPLATE_NAMES.forEach(function (tname) {
                        EXTENSIONS.forEach(function (ext) {
                            var key = lang + '/' + tname + '.' + ext;
                            var details = document.createElement('details');
                            details.style.margin = '0.4em 0';
                            var summary = document.createElement('summary');
                            summary.textContent = key;
                            var area = document.createElement('textarea');
                            area.setAttribute('data-key', key);
                            area.rows = 12;
                            area.style.cssText = 'width:100%;font-family:monospace;box-sizing:border-box';
                            area.value = lf(Object.prototype.hasOwnProperty.call(loadedOverrides, key) ? loadedOverrides[key] : defaults[key]);
                            var reset = document.createElement('button');
                            reset.type = 'button';

                        path.setAttribute('d', info.icon);
                        svg.appendChild(path);
                        label.appendChild(svg);
                    } else {
                        label.style.borderColor = 'rgba(128,128,128,0.9)';
                    }
                    var word = document.createElement('span');
                    word.textContent = invStateLabel(inv.state);
                    label.appendChild(word);
                    return label;
                }

                function invAccessNode(inv) {
                    var box = document.createElement('div');
                    box.className = 'ucInvAccess';
                    var pill = function (text, extraClass) {
                        var p = document.createElement('span');
                        p.className = 'ucInvPill' + (extraClass ? ' ' + extraClass : '');
                        p.textContent = text;
                        box.appendChild(p);
                    };
                    (Array.isArray(inv.libraries) ? inv.libraries : []).forEach(function (name) { pill(name); });
                    if (inv.liveTv === true) {
                        pill(s['inv.liveTv'], 'ucInvPillTv');
                        box.lastChild.style.borderColor = '#00a4dc';
                    }
                    if (!box.firstChild) {
                        var none = document.createElement('span');
                        none.className = 'ucInvNone';
                        // "None" is a fact only when Live TV was refused; with Live TV unknown (an older invitation) the access is not known.
                        none.textContent = inv.liveTv === false ? s['inv.noAccess'] : '\u2014';
                        box.appendChild(none);
                    }
                    return box;
                }

                function invUserNode(inv) {
                    var box = document.createElement('div');
                    var name = document.createElement('div');
                    name.className = 'ucInvName';
                    if (inv.userId) {
                        var link = document.createElement('a');
                        link.href = '#/dashboard/users/' + encodeURIComponent(inv.userId) + '/profile';
                        link.title = invText('inv.openProfile', inv.proposedUsername);
                        link.textContent = inv.proposedUsername;
                        name.appendChild(link);
                    } else {
                        name.textContent = inv.proposedUsername;
                    }
                    var sub = document.createElement('div');
                    sub.className = 'ucInvSub';
                    sub.textContent = inv.email || s['inv.noEmail'];
                    box.appendChild(name);
                    box.appendChild(sub);
                    return box;
                }

                function invDateNode(inv) {
                    var d = document.createElement('div');
                    d.className = 'ucInvDate';
                    d.textContent = invDateText(inv);
                    return d;
                }

                function invActionsNode(inv) {
                    var row = document.createElement('div');
                    row.className = 'ucInvActions';
                    if (inv.state === 'Pending' || inv.state === 'Expired') {
                        row.appendChild(invButton(s['inv.regenerate'], function () {
                            api('POST', 'MailConcierge/Invitations/' + inv.id + '/Regenerate').then(function (result) {
                                showInvLink(invEmailText(result, inv.email, 'inv.newLinkSent', 'inv.newLink', 'inv.newLinkNotSentLimit'), result.link);
                                return loadInvList();
                            }, function (e) { invErrorOf(e).then(invShowError); });
                        }));
                        row.appendChild(invButton(s['inv.revoke'], function () {
                            if (!window.confirm(s['inv.confirmRevoke'])) { return; }
                            api('DELETE', 'MailConcierge/Invitations/' + inv.id).then(function () { $('ucInvResult').hidden = true; return loadInvList(); }, function (e) { invErrorOf(e).then(invShowError); });
                        }));
                    }
                    row.appendChild(invEraseButton(inv));
                    return row;
                }

                // The filter buttons are created once and updated in place (the one with the focus keeps it).
                function renderInvFilters() {
                    var box = $('ucInvFilters');
                    box.setAttribute('aria-label', s['inv.col.status']);
                    var keys = ['all'].concat(INV_STATES);
                    if (box.children.length !== keys.length) {
                        box.textContent = '';
                        keys.forEach(function (key) {
                            var b = document.createElement('button');
                            b.type = 'button';
                            b.className = 'ucInvFilter';
                            b.addEventListener('click', function () { invFilter = key; renderInvList(); });
                            box.appendChild(b);
                        });
                    }
                    keys.forEach(function (key, i) {
                        var count = key === 'all' ? invItems.length : invItems.filter(function (inv) { return inv.state === key; }).length;
                        var b = box.children[i];
                        b.textContent = (key === 'all' ? s['inv.filter.all'] : invStateLabel(key)) + ' (' + count + ')';
                        b.setAttribute('aria-pressed', invFilter === key ? 'true' : 'false');
                    });
                }

                // One function feeds the table and the cards.
                function renderInvList() {
                    $('ucInvEmpty').hidden = invItems.length > 0;
                    $('ucInvHistory').hidden = invItems.length === 0;
                    var search = $('ucInvSearch');
                    search.placeholder = s['inv.search'];
                    search.setAttribute('aria-label', s['inv.search']);
                    renderInvFilters();
                    var shown = invSortedItems(invItems).filter(invMatches);
                    var body = $('ucInvTable').querySelector('tbody');
                    var cards = $('ucInvCards');
                    body.textContent = '';
                    cards.textContent = '';
                    shown.forEach(function (inv) {
                        var row = document.createElement('tr');
                        row.setAttribute('data-id', inv.id);
                        [invUserNode(inv), invStatusNode(inv), invAccessNode(inv), invDateNode(inv), invActionsNode(inv)].forEach(function (node) {
                            var cell = document.createElement('td');
                            cell.appendChild(node);
                            row.appendChild(cell);
                        });
                        body.appendChild(row);

                        var card = document.createElement('article');
                        card.className = 'ucInvCard';
                        card.setAttribute('data-id', inv.id);
                        [invUserNode(inv), invStatusNode(inv), invAccessNode(inv), invDateNode(inv), invActionsNode(inv)].forEach(function (node) { card.appendChild(node); });
                        cards.appendChild(card);
                    });
                    var noMatch = $('ucInvNoMatch');
                    noMatch.textContent = s['inv.noMatch'];
                    noMatch.hidden = invItems.length === 0 || shown.length > 0;
                }

                function loadInvList() {
                    return api('GET', 'MailConcierge/Invitations').then(function (items) {
                        invItems = Array.isArray(items) ? items : [];
                        renderInvList();
                    });
                }

                $('ucInvSearch').addEventListener('input', function () {
                    invQuery = $('ucInvSearch').value.trim().toLowerCase();
                    renderInvList();
                });

                // The sentence for the outcome of an invitation e-mail: sent, or the reason it was not.
                function invEmailText(result, address, sentKey, otherKey, limitKey) {
                    if (result.emailed) { return s[sentKey].replace('{0}', address); }
                    if (result.emailStatus === 'limit_reached') { return s[limitKey]; }
                    if (result.emailStatus === 'queue_full') { return s['inv.notSentQueueFull']; }
                    return s[otherKey];
                }

                function loadInvitations() {
                    invShowError('');
                    // A link is shown only once, right after it is created: leaving and coming back hides it.
                    $('ucInvResult').hidden = true;
                    return Promise.all([loadInvLibraries(), loadInvList()]).then(null, function () { invShowError(s['inv.errGeneric']); });
                }

                $('ucInvEmail').addEventListener('input', updateInvSubmitLabel);
                $('ucInvCopy').addEventListener('click', copyInvLink);
                $('ucInvLiveTv').addEventListener('change', syncInvSelectAll);
                $('ucInvSelectAll').addEventListener('change', function () {
                    var on = $('ucInvSelectAll').checked;
                    invLibraryBoxes().forEach(function (b) { b.checked = on; });
                });

                $('ucInvForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    invShowError('');
                    $('ucInvResult').hidden = true;
                    var email = $('ucInvEmail').value.trim();
                    var days = parseInt($('ucInvDays').value, 10);
                    var libraryIds = Array.prototype.map.call($('ucInvLibraries').querySelectorAll('input:checked'), function (i) { return i.value; });
                    if (!libraryIds.length && !window.confirm(s['inv.confirmNoLibrary'])) { return false; }
                    Dashboard.showLoadingMsg();
                    api('POST', 'MailConcierge/Invitations', {
                        proposedUsername: $('ucInvUsername').value.trim(),
                        email: email || null,
                        libraryIds: libraryIds,
                        liveTv: invLiveTvVisible() && $('ucInvLiveTv').checked,
                        days: isNaN(days) ? null : days,
                        language: $('ucInvLanguage').value
                    }).then(function (result) {
                        Dashboard.hideLoadingMsg();
                        if (email) {
                            showInvLink(invEmailText(result, email, 'inv.sentTo', 'inv.notSent', 'inv.notSentLimit'), result.link);
                        } else {
                            showInvLink(s['inv.linkReady'], result.link);
                            copyInvLink();
                        }
                        $('ucInvUsername').value = '';
                        $('ucInvEmail').value = '';
                        updateInvSubmitLabel();
                        // The new invitation must be in sight: no status filter and no search left over.
                        invFilter = 'all';
                        invQuery = '';
                        $('ucInvSearch').value = '';
                        return loadInvList();
                    }, function (response) {
                        Dashboard.hideLoadingMsg();
                        return invErrorOf(response).then(invShowError);
                    });
                    return false;
                });
            }());
        </script>
    </div>
</body>
</html>
