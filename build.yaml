changelog: >
  Links in e-mails carry their token after a hash sign so it stays out of server logs; a Live TV checkbox on each invitation (off by default);
  the plugin starts turned off and refuses to be enabled until the public URL, the SMTP server and the sender are valid; SMTP provider list
  (Gmail, Brevo, SMTP2GO, Mailgun, Mailjet); invitation history as a table with status, access and filters; e-mail logo setting;
  e-mail counters in the settings; clearer public pages. If e-mails stop after the update, check the SMTP server (name only), port and sender in the settings.
  Needs Jellyfin 12.4; Jellyfin 12.1 to 12.3 stay on 12.0.0.0.
