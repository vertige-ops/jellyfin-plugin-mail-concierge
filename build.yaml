framework: "net10.0"
overview: "E-mail invitations, e-mail password recovery and sign-in by e-mail address for Jellyfin"
description: >
  Mail Concierge lets administrators invite people by e-mail, lets users
  recover their password by e-mail and, if the administrator allows it, sign in
  with their e-mail address, without any change to Jellyfin itself.
category: "General"
